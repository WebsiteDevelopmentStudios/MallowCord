[package]
name = "mallowcord-rust-d1-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.9.0", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "js"] }


[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
