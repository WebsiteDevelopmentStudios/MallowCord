name: Rust D1 Worker

on:
  push:
    branches: [main, "feature/rust-d1-worker"]
    paths:
      - "rust-d1-worker/**"
      - "migrations/**"
      - "wrangler.rust.jsonc"
      - ".github/workflows/rust-d1-worker.yml"
  pull_request:
    paths:
      - "rust-d1-worker/**"
      - "migrations/**"
      - "wrangler.rust.jsonc"
      - ".github/workflows/rust-d1-worker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        working-directory: rust-d1-worker
        run: cargo fmt --all
      - name: Install worker-build
        run: cargo install worker-build --locked
      - name: Build Cloudflare Rust Worker
        working-directory: rust-d1-worker
        run: worker-build --release
