services:
  - type: web
    name: mallowcord-web
    runtime: static
    buildCommand: echo "MallowCord frontend ready"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
