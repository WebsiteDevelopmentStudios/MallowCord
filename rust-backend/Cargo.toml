[package]
name = "mallowcord-backend"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "multipart", "tokio", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
hex = "0.4"
object_store = { version = "0.12", features = ["aws"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
